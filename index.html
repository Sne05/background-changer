<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
</head>
<body id="bd">
     <input type="color" id="color" onchange="changecolor()">
     <script>
        document.getElementById("bd").style.backgroundColor="black";
         function changecolor(){
            let color=document.getElementById("color").value;
            document.getElementById("bd").style.backgroundColor=color;
         }
     </script>
</body>
</html>
